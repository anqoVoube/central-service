[package]
name = "central-service"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
bincode = "1"
bs58 = "0.5"
csv = "1"
dotenvy = "0.15"
futures = "0.3"
mongodb = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
solana-client = "2"
solana-compute-budget-interface = "2"
solana-sdk = "2"
solana-transaction-status-client-types = "2"
spl-associated-token-account = "4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Harmonic bundle submission (gRPC, Jito-compatible protos, Searcher role = 3).
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"

[build-dependencies]
tonic-build = "0.12"
